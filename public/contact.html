<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact | Nolan's Portfolio</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <script src="/script.js" defer></script>
</head>
<body>

<header>
  <h1><i class="fa-solid fa-code"></i> Nolan's Portfolio</h1>
  <nav>
    <a href="/"><i class="fa-solid fa-house"></i> Home</a>
    <a href="/about"><i class="fa-solid fa-user"></i> About</a>
    <a href="/projects"><i class="fa-solid fa-diagram-project"></i> Projects</a>
    <a href="/skills"><i class="fa-solid fa-star"></i> Skills</a>
    <a href="/contact"><i class="fa-solid fa-envelope"></i> Contact</a>
  </nav>
</header>

<main>
  <h2>Contact Me</h2>
  <p>Have a question or want to work together? Fill out the form below and I'll get back to you!</p>

  <form onsubmit="return validateForm()" method="POST" action="/submit">

    <label for="name"><i class="fa-solid fa-user"></i> Name</label>
    <input type="text" id="name" name="name" placeholder="Your Name">
    <p class="error" id="nameError"></p>

    <label for="email"><i class="fa-solid fa-envelope"></i> Email</label>
    <input type="email" id="email" name="email" placeholder="Your Email">
    <p class="error" id="emailError"></p>

    <label for="message"><i class="fa-solid fa-message"></i> Message</label>
    <textarea id="message" name="message" placeholder="Your Message"></textarea>
    <p class="error" id="messageError"></p>

    <button type="submit"><i class="fa-solid fa-paper-plane"></i> Send Message</button>

  </form>
</main>

<footer>
  <p>© 2026 Nolan's Portfolio. All rights reserved.</p>
</footer>

</body>
</html>
